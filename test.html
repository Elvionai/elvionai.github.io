<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Philadelphia Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0a09;--panel:#14120f;--line:rgba(255,246,225,.1);--gold:#c9a96e;--tx:#efe9dd;--mu:#8a8275;--bad:#e05a5a;--ok:#5fb87a;--serif:'Iowan Old Style',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--tx);font-family:var(--serif)}
#app{height:100%;max-width:880px;margin:auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.brand{font:900 1.15rem 'Playfair Display',serif;letter-spacing:.14em;color:var(--gold)}
button,.ib{font:inherit;color:var(--tx);background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover,.ib:hover{border-color:var(--gold);color:var(--gold)}
#chat{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}
.grp{max-width:92%;display:flex;flex-direction:column;gap:6px}
.grp.usr{align-self:flex-end;align-items:flex-end}
.usr .bub{background:rgba(255,246,225,.06);border:1px solid var(--line);padding:10px 15px;border-radius:16px 16px 4px 16px}
.bub{line-height:1.75;overflow-wrap:anywhere}
.tick{animation:tick .11s linear}
@keyframes tick{25%{transform:translate(.7px,-.7px)}75%{transform:translate(-.7px,.6px)}}
.cur{display:inline-block;width:7px;height:1em;background:var(--gold);vertical-align:text-bottom;margin-left:2px;animation:vib .12s linear infinite}
@keyframes vib{50%{transform:translate(1px,-1px)}}
.empty{margin:auto;text-align:center;color:var(--mu);max-width:340px;line-height:1.7}
.empty b{display:block;font:700 1.4rem 'Playfair Display',serif;color:var(--gold);margin-bottom:6px}
.st{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:.92rem}
.dots{display:flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:dp 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.6)}40%{opacity:1;transform:scale(1.2)}}
.think{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:.86rem;color:var(--mu)}
.think[hidden]{display:none}
.think summary{padding:7px 12px;cursor:pointer}
.think .tk{padding:4px 12px 10px;border-top:1px solid var(--line);max-height:220px;overflow:auto}
.arts{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0}
.frame{background:var(--panel);border:1px solid rgba(201,169,110,.35);border-radius:6px;padding:10px;max-width:min(100%,420px);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.mat{background:var(--ink);padding:8px;border:1px solid var(--line)}
.mat img{display:block;max-width:100%;max-height:60vh;margin:auto;opacity:0;filter:blur(14px);transition:opacity .6s,filter .6s;cursor:zoom-in}
.mat img.in{opacity:1;filter:none}
figcaption{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:9px;font-size:.78rem;color:var(--mu)}
figcaption button,figcaption a,.file a{font-size:.8rem;padding:4px 10px;margin-left:6px;color:var(--gold);border:1px solid var(--line);border-radius:8px;text-decoration:none;background:none}
.file{display:flex;align-items:center;gap:12px;padding:6px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.ctl button{font-size:.75rem;padding:3px 10px;color:var(--mu)}
.ask{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ask p{width:100%}
pre{background:#050505;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font:.82rem/1.5 ui-monospace,Menlo,monospace;margin:8px 0}
code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px}pre code{background:none;padding:0}
li{margin-left:1.3em;list-style:disc}h4{font:700 1.05rem 'Playfair Display',serif;color:var(--gold);margin:8px 0 2px}
a{color:var(--gold)}
#chips,#pend{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px}
#chips button{font-size:.8rem;border-radius:16px;padding:5px 12px;color:var(--mu)}
#pend span{border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:.78rem;color:var(--gold)}
footer{display:flex;align-items:flex-end;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
footer textarea{flex:1;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:11px 14px;font:inherit;resize:none;max-height:160px;outline:none}
footer textarea:focus{border-color:var(--gold)}
#send{background:var(--tx);color:#000;border-radius:12px;font-weight:700}#stop{border-color:var(--bad);color:var(--bad)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:10}#scrim.on{display:block}
#drawer{position:fixed;top:0;left:-420px;width:min(380px,88vw);height:100%;background:var(--panel);border-right:1px solid var(--line);z-index:11;padding:18px;overflow-y:auto;transition:left .3s}
#drawer.on{left:0}#drawer h3{font:700 .95rem 'Playfair Display',serif;color:var(--gold);margin:20px 0 8px}#drawer h3:first-child{margin-top:0}
#drawer textarea{width:100%;min-height:80px;background:var(--ink);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;font-size:.9rem}
.ci{display:flex;gap:6px;margin-bottom:5px}.ci button:first-child{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci.on button:first-child{border-color:var(--gold);color:var(--gold)}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg .on{border-color:var(--gold);color:var(--gold)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}#lb.on{display:flex}#lb img{max-width:96vw;max-height:94vh}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);padding:9px 16px;border-radius:18px;font-size:.85rem;display:none;z-index:30}
#call{position:fixed;inset:0;z-index:25;background:radial-gradient(circle at 50% 20%,#1d1810,#000 70%);display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:40px 20px calc(30px + env(safe-area-inset-bottom,0px))}
#call.on{display:flex}#ctime{color:var(--mu);font-size:.85rem}
.orb{width:150px;height:150px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font:900 3rem 'Playfair Display',serif;color:var(--gold);transition:.3s}
.orb.sp{border-color:var(--gold);box-shadow:0 0 60px rgba(201,169,110,.35);transform:scale(1.05)}
#cap{width:100%;max-width:520px;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
#cap .user{text-align:right;color:var(--mu)}#cap .bot{color:#e8d5b0}.cc{display:flex;gap:14px}
.usr .ctl{justify-content:flex-end}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="menuBtn" aria-label="Open menu">Menu</button>
    <div class="brand">PHILADELPHIA</div>
    <span style="display:flex;gap:6px"><button id="callBtn" title="Live voice call (10 credits)">Call</button><button id="balBtn" title="Credits"><span id="balN">--</span> credits</button></span>
  </header>
  <main id="chat"></main>
  <div id="chips"></div>
  <div id="pend"></div>
  <footer>
    <label class="ib" for="file" title="Attach images or documents">Attach</label>
    <input type="file" id="file" hidden multiple accept="image/*,.pdf,.docx,.txt,.md,.csv,.tsv,.json,.log,.xlsx">
    <textarea id="ti" rows="1" placeholder="Ask for anything: images, edits, designs, files…"></textarea>
    <button id="send">Send</button><button id="stop" hidden>Stop</button>
  </footer>
</div>
<div id="scrim"></div>
<aside id="drawer">
  <h3>Chats</h3>
  <button id="newChat" style="width:100%;margin-bottom:8px">New chat</button>
  <div id="chatList"></div>
  <h3>Personality</h3>
  <div class="seg" id="seg"><button data-p="philadelphia">Philadelphia</button><button data-p="bobby">Bobby</button></div>
  <h3>Memory</h3>
  <div class="row"><span>Remember across chats</span><input type="checkbox" id="xmem"></div>
  <textarea id="mem" placeholder="Things I should always know about you…"></textarea>
  <button id="saveMem" style="margin-top:6px">Save</button>
  <h3>Notifications</h3>
  <div class="row"><span>Tell me when a task finishes</span><input type="checkbox" id="notif"></div>
  <h3>Credits</h3>
  <button id="claim" style="width:100%">Claim daily credits</button>
  <button id="fund" style="width:100%;margin-top:6px">Fund wallet</button>
  <h3>Referrals</h3>
  <div style="font-size:.8rem;color:var(--mu);margin-bottom:4px">Your code</div>
  <code id="refCode" style="display:block;word-break:break-all;margin-bottom:10px"></code>
  <div class="ci"><input id="refIn" placeholder="Friend's code or email" style="flex:1;min-width:0;background:var(--ink);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit"><button id="redeem">Redeem</button></div>
  <button id="out" style="width:100%;margin-top:22px;color:var(--bad)">Sign out</button>
</aside>
<div id="call"><div style="text-align:center"><div style="font:700 1rem 'Playfair Display',serif;color:var(--gold);letter-spacing:.2em">PHILADELPHIA</div><div id="ctime">00:00</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:18px;width:100%"><div class="orb" id="orb">P</div><div id="cst">Ringing…</div><div id="cap"></div></div>
  <div class="cc"><button id="muteBtn">Mute</button><button id="endBtn" style="background:var(--bad);border-color:var(--bad);color:#fff">End call</button></div></div>
<div id="lb"><img alt=""></div>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,setDoc,deleteDoc,query,orderBy,serverTimestamp,getDocs,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyAyROm0aBGjry6NUfhNM3e0qwPcCDoIqSk",authDomain:"elvionai.firebaseapp.com",projectId:"elvionai",storageBucket:"elvionai.appspot.com",messagingSenderId:"161078300830",appId:"1:161078300830:web:f460df8591704eb0e96b8f"});
const auth=getAuth(app),db=getFirestore(app);
const API='https://web-production-9a18.up.railway.app';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SEP='\u0000THINK\u0000';
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

// ---- Personalities: paste your full prompts between the backticks. The server keeps the first 1500 characters. ----
const PERSONAS={
  philadelphia:{prompt:`You are Philadelphia.`},
  bobby:{prompt:`You are Bobby.`}
};

let user=null,chatId=null,msgs=[],busy=false,pend=[],persona=localStorage.getItem('ph_persona')||'philadelphia',runId=null,audio=null;
let unsubChats=null,unsubMsgs=null,dirty=false;
const LS=(k,v)=>v===undefined?localStorage.getItem(k):localStorage.setItem(k,v);

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
async function call(path,o={}){
  const h={'X-Firebase-Token':await auth.currentUser.getIdToken()};let body=o.body;
  if(o.json){h['Content-Type']='application/json';body=JSON.stringify(o.json)}
  return fetch(API+path,{method:o.method||'GET',headers:h,body});
}

// ---- markdown (small) ----
function md(t=''){
  const bl=[];
  t=t.replace(/```(\w+)?\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{bl.push(`<pre><code>${esc(c.replace(/\n$/,''))}</code></pre>`);return `\u0001${bl.length-1}\u0001`});
  let s=esc(t).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|\W)\*([^*\n]+)\*/g,'$1<i>$2</i>')
   .replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
   .replace(/^#{1,3} (.+)$/gm,'<h4>$1</h4>').replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
   .replace(/\n/g,'<br>').replace(/<\/(li|h4)><br>/g,'</$1>').replace(/\u0001(\d+)\u0001/g,(m,i)=>bl[i]);
  return s;
}
// pull any <think> text out of a reply so it can never sit in the answer
function splitThink(t=''){
  let th=[];
  t=t.replace(/<[\w:]*think(?:ing)?>([\s\S]*?)(?:<\/[\w:]*think(?:ing)?>|$)/gi,(m,c)=>{th.push(c.trim());return ''});
  const m=t.match(/<\/[\w:]*think(?:ing)?>/i);
  if(m){th.push(t.slice(0,m.index).trim());t=t.slice(m.index+m[0].length)}
  return {think:th.filter(Boolean).join('\n\n'),body:t.trim()};
}
const plain=t=>t.replace(/```[\s\S]*?```/g,' ').replace(/[*_`#>]/g,'').replace(/\s+/g,' ').trim();

// ---- elements ----
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
const scroll=()=>{const c=$('chat');c.scrollTop=c.scrollHeight};
function artEl(a){
  const f=el('figure','frame'),src=API+a.url;
  if(a.kind==='image'){
    f.innerHTML=`<div class="mat"><img alt="" src="${src}" data-act="open"></div><figcaption><span>${a.width&&a.height?a.width+' × '+a.height:''}</span><span><button data-act="open">Open</button><a href="${API+(a.download_url||a.url)}" download>Download</a></span></figcaption>`;
    const im=f.querySelector('img');im.onload=()=>{im.classList.add('in');scroll()};im.onerror=()=>{f.innerHTML='<div class="file">This image has expired. Ask me to make it again.</div>'};
  }else f.innerHTML=`<div class="file"><b>${esc(a.name||'File')}</b><a href="${src}" download>Download</a></div>`;
  return f;
}
const ctl=()=>`<div class="ctl"><button data-act="copy">Copy</button><button data-act="listen">Listen</button><button data-act="regen">Regenerate</button></div>`;

function addUser(text,files=[],id=''){
  const g=el('div','grp usr');
  const th=files.filter(f=>f.url).map(f=>`<img src="${API+f.url}" alt="" style="max-height:120px;border-radius:8px;margin-bottom:6px;display:block" onerror="this.remove()">`).join('');
  const nm=files.filter(f=>!f.url).map(f=>`<div style="color:var(--gold);font-size:.8rem">${esc(f.name)}</div>`).join('');
  g.dataset.id=id;g.innerHTML=`<div class="bub">${th}${nm}${md(text)}</div>${id?'<div class="ctl"><button data-act="edit">Edit</button><button data-act="copy">Copy</button></div>':''}`;
  $('chat').appendChild(g);scroll();
}
function render(){
  const c=$('chat');c.innerHTML='';
  if(!msgs.length){c.innerHTML='<div class="empty"><b>What shall we make?</b>Describe an image, a poster, or an edit. Attach a photo and tell me what to change. I will ask if I need to know something.</div>';$('chips').innerHTML='';return}
  msgs.forEach(m=>{
    if(m.role==='user'){addUser(m.text||'',m.files||[],m.id);return}
    let th='',body=m.text||'';
    if(body.includes(SEP)){[th,body]=body.split(SEP)}
    const g=el('div','grp ai');
    g.dataset.id=m.id||'';g.innerHTML=`<div class="bub">${th?`<details class="think"><summary>Thinking</summary><div class="tk">${md(th)}</div></details>`:''}<div class="arts"></div><div class="body">${md(body)}</div></div>${ctl()}`;
    (m.arts||[]).forEach(a=>g.querySelector('.arts').appendChild(artEl(a)));
    c.appendChild(g);
  });
  const last=[...msgs].reverse().find(m=>m.role!=='user');
  setChips(last?last.text:'',last?last.arts:[]);
  scroll();
}
function setChips(text,arts){
  let l;
  if((arts||[]).some(a=>a.kind==='image'))l=['Add a caption','Remove the background','Resize for Instagram'];
  else if(/```/.test(text||''))l=['Explain this code','Add error handling'];
  else if((arts||[]).length)l=['Make another version'];
  else l=['Go deeper','Give an example','Make it shorter'];
  $('chips').innerHTML=l.map(x=>`<button data-chip="${esc(x)}">${esc(x)}</button>`).join('');
}

// ---- live run view ----
function mkLive(){
  const g=el('div','grp ai');
  g.innerHTML=`<div class="bub"><details class="think" hidden><summary>Thinking</summary><div class="tk"></div></details><div class="st"><span class="dots"><i></i><i></i><i></i></span><span class="stt">Starting…</span></div><div class="arts"></div><div class="body"></div></div>`;
  $('chat').appendChild(g);scroll();
  const L={g,arts:[],think:''};
  L.status=t=>{const s=g.querySelector('.stt');if(s)s.textContent=t};
  L.addThink=t=>{if(!t)return;L.think+=(L.think?'\n\n':'')+t;g.querySelector('.think').hidden=false;g.querySelector('.tk').innerHTML=md(L.think)};
  L.addArt=a=>{if(L.arts.some(x=>x.id===a.id))return;const k={id:a.id,kind:a.kind,url:a.url,download_url:a.download_url,name:a.name,width:a.width,height:a.height};L.arts.push(k);g.querySelector('.arts').appendChild(artEl(k));scroll()};
  L.asked=new Set();
  L.ask=p=>{
    if(L.asked.has(p.tool_use_id))return;L.asked.add(p.tool_use_id);
    const a=el('div','ask');a.dataset.id=p.tool_use_id;a.dataset.kind=p.kind;
    a.innerHTML=`<p>${esc(p.question)}</p>`+(p.options||[]).map((o,i)=>`<button data-act="answer" data-i="${i}">${esc(o)}</button>`).join('')+(p.kind==='ask'?`<input style="flex:1;min-width:140px;background:var(--ink);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit" placeholder="Or type your answer"><button data-act="answer-text">Send</button>`:'');
    g.querySelector('.bub').appendChild(a);L.status('Waiting for you…');scroll();
  };
  return L;
}
async function answer(box,text,approve){
  box.remove();
  await call(`/api/agent/runs/${runId}/answer`,{method:'POST',json:{answer:text,approve}});
}

async function follow(rid,L){
  let after=0,res={status:'running',final_text:''};
  while(true){
    let d;
    try{
      const r=await call(`/api/agent/runs/${rid}?after=${after}`);
      if(r.status===404)throw new Error('This task is no longer available.');
      if(!r.ok){L.status('Reconnecting…');await sleep(2500);continue}
      d=await r.json();
    }catch(e){
      if(/no longer/.test(e.message))return {status:'error',final_text:e.message};
      L.status('Reconnecting…');await sleep(2500);continue;
    }
    for(const e of d.events||[]){
      after=e.seq;const x=e.data||{};
      if(e.type==='status')L.status(x.text||'Working…');
      else if(e.type==='thinking'){L.addThink(x.text);L.status('Thinking…')}
      else if(e.type==='tool_start')L.status((x.label||'Working')+'…');
      else if(e.type==='artifact')L.addArt(x);
      else if(e.type==='ask_user')L.ask(x);
      else if(e.type==='paused')L.status('Connection lost. Resuming…');
    }
    if(d.status==='waiting'&&d.pending)L.ask(d.pending);
    $('balN').dataset.s=d.credits_spent||0;
    if(['done','error','cancelled'].includes(d.status))return d;
    await sleep(1500);
  }
}

async function reveal(el_,text){
  if(reduce||text.length>1800){el_.innerHTML=md(text);return}
  const tk=text.split(/(\s+)/);let acc='';
  for(const t of tk){
    acc+=t;el_.innerHTML=md(acc)+'<span class="cur"></span>';
    el_.classList.remove('tick');void el_.offsetWidth;el_.classList.add('tick');
    if(t.trim()){scroll();await sleep(14)}
  }
  el_.innerHTML=md(text);
}

async function finish(L,d){
  const raw=(d.final_text||'').trim()||(d.status==='cancelled'?'Stopped.':'Done.');
  const {think,body}=splitThink(raw);
  if(think)L.addThink(think);
  const text=body||'Done.';
  L.g.querySelector('.st')?.remove();
  await reveal(L.g.querySelector('.body'),text);
  L.g.insertAdjacentHTML('beforeend',ctl());
  setChips(text,L.arts);scroll();
  const saved=L.think?L.think+SEP+text:text;
  await saveMsg('ai',saved,{arts:JSON.parse(JSON.stringify(L.arts))});
  LS('ph_active_'+chatId,'');
  rememberDigest(text);
  notify(d.status==='done'?'Your task is finished.':'Your task has stopped.');
  updBal();
}

// ---- sending ----
function personaText(){
  let p=PERSONAS[persona].prompt;
  const mem=LS('ph_memory');if(mem)p+=`\nAbout the user: ${mem}`;
  if($('xmem').checked){
    const dg=JSON.parse(LS('ph_digest')||'[]').filter(x=>x.c!==chatId).slice(-5).map(x=>x.t).join(' | ');
    if(dg)p+=`\nEarlier chats (use only if relevant): ${dg}`;
  }
  return p.slice(0,1500);
}
let lastUserText='';
function rememberDigest(reply){
  const dg=JSON.parse(LS('ph_digest')||'[]');
  dg.push({c:chatId,t:`User: ${lastUserText.slice(0,80)} / You: ${plain(reply).slice(0,120)}`});
  LS('ph_digest',JSON.stringify(dg.slice(-20)));
}
function setBusy(b){busy=b;$('send').hidden=b;$('stop').hidden=!b;if(!b&&dirty){dirty=false;render()}}

async function send(txt){
  const ti=$('ti');
  let text=(txt??ti.value).trim();
  if((!text&&!pend.length)||busy)return;
  if(!text)text='Look at the attached file and tell me what you see.';
  setBusy(true);askNotify();
  const files=pend.map(p=>({name:p.name,url:p.url||''})),ids=pend.map(p=>p.id);
  pend=[];drawPend();ti.value='';ti.style.height='';$('chips').innerHTML='';
  if($('chat').querySelector('.empty'))$('chat').innerHTML='';
  addUser(text,files);lastUserText=text;
  const first=!msgs.length;
  await saveMsg('user',text,{files});
  if(first)setDoc(doc(db,'users',user.uid,'chats',chatId),{name:text.slice(0,40)},{merge:true});
  const L=mkLive();
  try{
    const body={message:text,persona:personaText(),chat_id:chatId,artifact_ids:ids};
    const par=LS('ph_run_'+chatId);if(par)body.parent_run_id=par;
    let r=await call('/api/agent/run',{method:'POST',json:body});
    if(r.status===404&&body.parent_run_id){delete body.parent_run_id;r=await call('/api/agent/run',{method:'POST',json:body})}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.detail||'Could not start the task.');
    runId=j.run_id;LS('ph_run_'+chatId,runId);LS('ph_active_'+chatId,runId);
    await finish(L,await follow(runId,L));
  }catch(e){await finish(L,{status:'error',final_text:e.message})}
  setBusy(false);
}

// ---- storage ----
async function saveMsg(role,text,extra={}){
  if(!chatId||!user)return;
  try{await addDoc(collection(db,'users',user.uid,'chats',chatId,'messages'),{role,text,...extra,createdAt:serverTimestamp()})}catch(e){console.warn(e)}
}
function loadChats(){
  unsubChats?.();
  unsubChats=onSnapshot(query(collection(db,'users',user.uid,'chats'),orderBy('createdAt','desc')),async snap=>{
    if(snap.empty){await newChat();return}
    const cs=snap.docs.map(d=>({id:d.id,...d.data()}));
    $('chatList').innerHTML=cs.map(c=>`<div class="ci${c.id===chatId?' on':''}"><button data-open="${c.id}">${esc(c.name||'New chat')}</button><button data-del="${c.id}" aria-label="Delete">×</button></div>`).join('');
    if(!chatId||!cs.find(c=>c.id===chatId)){chatId=(cs.find(c=>c.id===LS('ph_chat'))||cs[0]).id;sub()}
  });
}
async function newChat(){const r=await addDoc(collection(db,'users',user.uid,'chats'),{name:'New chat',createdAt:serverTimestamp()});chatId=r.id;sub()}
function sub(){
  unsubMsgs?.();LS('ph_chat',chatId);let first=true;
  unsubMsgs=onSnapshot(query(collection(db,'users',user.uid,'chats',chatId,'messages'),orderBy('createdAt')),snap=>{
    msgs=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!busy)render();else dirty=true;
    if(first){first=false;const ar=LS('ph_active_'+chatId);if(ar&&!busy)resume(ar)}
  });
}
async function resume(rid){
  setBusy(true);runId=rid;const L=mkLive();L.status('Picking up where we left off…');
  await finish(L,await follow(rid,L));setBusy(false);
}

// ---- uploads ----
$('file').onchange=async e=>{
  for(const f of e.target.files){
    toast('Uploading '+f.name+'…');
    const fd=new FormData();fd.append('file',f);
    try{
      const r=await call('/api/agent/upload',{method:'POST',body:fd});const j=await r.json();
      if(!r.ok)throw new Error(j.detail||'Upload failed');
      pend.push({id:j.id,name:f.name,url:j.url||''});drawPend();
    }catch(err){toast(err.message)}
  }
  e.target.value='';
};
function drawPend(){$('pend').innerHTML=pend.map((p,i)=>`<span>${esc(p.name)} <a href="#" data-rm="${i}" style="text-decoration:none">×</a></span>`).join('')}

// ---- read aloud (Philadelphia voice v2, default "kore") ----
async function listen(btn){
  if(audio){audio.pause();audio=null;if(btn.dataset.on){btn.dataset.on='';btn.textContent='Listen';return}}
  const t=plain(btn.closest('.grp').querySelector('.body').innerText).slice(0,1800);if(!t)return;
  btn.textContent='Loading…';
  const r=await call('/api/tools/text-to-speech-v2',{method:'POST',json:{text:t,voice:'kore'}});
  if(!r.ok){const j=await r.json().catch(()=>({}));toast(j.detail||'Could not read this aloud.');btn.textContent='Listen';return}
  audio=new Audio(URL.createObjectURL(await r.blob()));btn.dataset.on=1;btn.textContent='Stop';
  audio.onended=()=>{btn.dataset.on='';btn.textContent='Listen';audio=null};audio.play();updBal();
}

// ---- notifications ----
function askNotify(){if($('notif').checked&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}
function notify(m){
  toast(m);
  if($('notif').checked&&document.hidden){
    if('Notification' in window&&Notification.permission==='granted'){try{new Notification('Philadelphia',{body:m})}catch(e){}}
    const t=document.title;document.title='✓ Done · '+t;
    document.addEventListener('visibilitychange',()=>{document.title=t},{once:true});
  }
}

// ---- wallet ----
async function updBal(){try{const r=await call('/api/user/keys-and-balance');if(r.ok)$('balN').textContent=(await r.json()).balance}catch(e){}}
$('claim').onclick=async()=>{const r=await call('/api/user/claim-daily',{method:'POST'});const j=await r.json().catch(()=>({}));toast(j.message||j.detail||'Done');updBal()};

// ---- events ----
$('chat').onclick=async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='open'){const im=b.closest('figure').querySelector('img');$('lb').querySelector('img').src=im.src;$('lb').classList.add('on')}
  else if(a==='copy'){navigator.clipboard.writeText((b.closest('.grp').querySelector('.body')||b.closest('.grp').querySelector('.bub')).innerText).catch(()=>{});b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1300)}
  else if(a==='listen')listen(b);
  else if(a==='edit')editMsg(b.closest('.grp').dataset.id);
  else if(a==='regen')regenMsg(b.closest('.grp').dataset.id);
  else if(a==='answer'){const box=b.closest('.ask');answer(box,b.textContent,box.dataset.kind==='budget'?+b.dataset.i===0:undefined)}
  else if(a==='answer-text'){const box=b.closest('.ask'),v=box.querySelector('input').value.trim();if(v)answer(box,v)}
};
$('stop').onclick=()=>{if(runId)call(`/api/agent/runs/${runId}/cancel`,{method:'POST'});$('stop').disabled=true;setTimeout(()=>$('stop').disabled=false,3000)};
$('lb').onclick=()=>$('lb').classList.remove('on');
$('chips').onclick=e=>{const b=e.target.closest('[data-chip]');if(b)send(b.dataset.chip)};
$('pend').onclick=e=>{const r=e.target.closest('[data-rm]');if(r){e.preventDefault();pend.splice(+r.dataset.rm,1);drawPend()}};
$('send').onclick=()=>send();
$('ti').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();send()}};
$('ti').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px'};
const drawer=on=>{$('drawer').classList.toggle('on',on);$('scrim').classList.toggle('on',on)};
$('menuBtn').onclick=()=>drawer(true);$('scrim').onclick=()=>drawer(false);$('balBtn').onclick=updBal;
$('newChat').onclick=()=>{if(!busy){newChat();drawer(false)}};
$('chatList').onclick=async e=>{
  const o=e.target.closest('[data-open]'),d=e.target.closest('[data-del]');
  if(o&&!busy){chatId=o.dataset.open;sub();drawer(false)}
  if(d&&confirm('Delete this chat?')){
    const id=d.dataset.del,ms=await getDocs(collection(db,'users',user.uid,'chats',id,'messages')),b=writeBatch(db);
    ms.docs.forEach(x=>b.delete(x.ref));await b.commit();await deleteDoc(doc(db,'users',user.uid,'chats',id));
    if(id===chatId)chatId=null;
  }
};
function paintPersona(){document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===persona))}
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;persona=b.dataset.p;LS('ph_persona',persona);paintPersona();toast(PERSONAS[persona]===PERSONAS.bobby?'Bobby is active':'Philadelphia is active')};
$('xmem').checked=LS('ph_xmem')==='1';$('xmem').onchange=e=>LS('ph_xmem',e.target.checked?'1':'0');
$('notif').checked=LS('ph_notif')!=='0';$('notif').onchange=e=>{LS('ph_notif',e.target.checked?'1':'0');askNotify()};
$('mem').value=LS('ph_memory')||'';$('saveMem').onclick=()=>{LS('ph_memory',$('mem').value.trim());toast('Saved')};
$('out').onclick=()=>auth.signOut().then(()=>location.href='signup-login.html');
paintPersona();

// ---- edit & regenerate ----
async function deleteFrom(idx){
  const b=writeBatch(db);
  msgs.slice(idx).forEach(m=>m.id&&b.delete(doc(db,'users',user.uid,'chats',chatId,'messages',m.id)));
  await b.commit();
}
async function editMsg(id){
  if(busy||!id)return;const i=msgs.findIndex(m=>m.id===id);if(i<0)return;
  const t=msgs[i].text||'';await deleteFrom(i);
  $('ti').value=t;$('ti').dispatchEvent(new Event('input'));$('ti').focus();
}
async function regenMsg(id){
  if(busy)return;const i=msgs.findIndex(m=>m.id===id);
  if(i<1||msgs[i-1].role!=='user'){toast('Give it a second, then try again.');return}
  const t=msgs[i-1].text;await deleteFrom(i-1);await sleep(250);send(t);
}

// ---- live call (10 credits, charged on connect) ----
// Paste your full call prompt here. Keep the spoken-call rules.
const CALL_PROMPT=`You are Philadelphia on a live voice call. Speak naturally and keep replies short. You cannot make images or files on a call; tell the person to type that request instead.`;
let cws=null,cmic=null,cctx=null,cnode=null,cplay=null,chead=0,cmuted=false,cactive=false,ctimer=null,rctx=null,rint=null,lastCap='',spT=null;
function ring(on){
  clearInterval(rint);rint=null;if(rctx){try{rctx.close()}catch(e){}rctx=null}
  if(!on)return;
  try{
    rctx=new AudioContext();
    const beep=()=>{if(!rctx)return;const t=rctx.currentTime;[0,.4].forEach(o=>{const os=rctx.createOscillator(),g=rctx.createGain();os.frequency.value=440;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.15,t+o+.05);g.gain.linearRampToValueAtTime(0,t+o+.35);os.connect(g);g.connect(rctx.destination);os.start(t+o);os.stop(t+o+.4)})};
    beep();rint=setInterval(beep,2000);
  }catch(e){}
}
function pcm16(f,rate){
  const ratio=rate/16000,n=Math.floor(f.length/ratio),o=new Int16Array(n);
  for(let i=0;i<n;i++){const x=i*ratio,a=Math.floor(x),b=Math.min(a+1,f.length-1),v=f[a]*(1-(x-a))+f[b]*(x-a),c=Math.max(-1,Math.min(1,v));o[i]=c<0?c*0x8000:c*0x7fff}
  return o;
}
function playPcm(buf){
  if(!cplay){cplay=new AudioContext({sampleRate:24000});chead=cplay.currentTime}
  const i16=new Int16Array(buf),f=new Float32Array(i16.length);
  for(let i=0;i<i16.length;i++)f[i]=i16[i]/(i16[i]<0?0x8000:0x7fff);
  const ab=cplay.createBuffer(1,f.length,24000);ab.copyToChannel(f,0);
  const src=cplay.createBufferSource();src.buffer=ab;src.connect(cplay.destination);
  const at=Math.max(cplay.currentTime,chead);src.start(at);chead=at+ab.duration;
  $('orb').classList.add('sp');$('cst').textContent='Speaking…';
  clearTimeout(spT);spT=setTimeout(()=>{$('orb').classList.remove('sp');if(cactive&&!cmuted)$('cst').textContent='Listening…'},ab.duration*1000+300);
}
function cap(role,t){
  const w=$('cap');let l=w.lastElementChild;
  if(l&&l.dataset.r===role)l.textContent+=t;else{l=el('div',role,'');l.dataset.r=role;l.textContent=t;w.appendChild(l);while(w.children.length>8)w.firstChild.remove()}
  w.scrollTop=w.scrollHeight;
}
async function startCall(){
  if(cactive||busy)return;
  cactive=true;cmuted=false;$('muteBtn').textContent='Mute';$('cap').innerHTML='';$('ctime').textContent='00:00';$('cst').textContent='Ringing…';
  $('call').classList.add('on');ring(true);
  let tok;
  try{tok=await auth.currentUser.getIdToken();cmic=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1}})}
  catch(e){ring(false);$('cst').textContent='Allow microphone access to start a call.';setTimeout(endCall,2200);return}
  cws=new WebSocket(`${API.replace(/^http/,'ws')}/ws/live-call?token=${encodeURIComponent(tok)}&voice=Kore&system=${encodeURIComponent(CALL_PROMPT)}`);
  cws.binaryType='arraybuffer';
  cws.onopen=()=>{
    ring(false);$('cst').textContent='Listening…';const t0=Date.now();
    ctimer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('ctime').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
    cctx=new AudioContext();const src=cctx.createMediaStreamSource(cmic);cnode=cctx.createScriptProcessor(4096,1,1);
    src.connect(cnode);cnode.connect(cctx.destination);
    cnode.onaudioprocess=e=>{if(!cws||cws.readyState!==1||cmuted)return;cws.send(pcm16(e.inputBuffer.getChannelData(0),cctx.sampleRate).buffer)};
  };
  cws.onmessage=ev=>{
    if(ev.data instanceof ArrayBuffer){playPcm(ev.data);return}
    try{const d=JSON.parse(ev.data);if(d.type==='ai_caption')cap('bot',d.content);else if(d.type==='user_caption')cap('user',d.content);else if(d.type==='error'){$('cst').textContent=d.content;updBal()}}catch(e){}
  };
  cws.onclose=()=>{if(cactive)setTimeout(endCall,500)};
  cws.onerror=()=>{$('cst').textContent='Connection error.'};
  updBal();
}
function endCall(){
  cactive=false;ring(false);clearInterval(ctimer);clearTimeout(spT);
  if(cws){try{cws.close(1000)}catch(e){}cws=null}
  if(cnode){cnode.disconnect();cnode.onaudioprocess=null;cnode=null}
  if(cctx){cctx.close().catch(()=>{});cctx=null}
  if(cplay){cplay.close().catch(()=>{});cplay=null}
  if(cmic){cmic.getTracks().forEach(t=>t.stop());cmic=null}
  $('orb').classList.remove('sp');$('call').classList.remove('on');
}
$('callBtn').onclick=startCall;$('endBtn').onclick=endCall;
$('muteBtn').onclick=()=>{cmuted=!cmuted;$('muteBtn').textContent=cmuted?'Unmute':'Mute';$('cst').textContent=cmuted?'Muted':'Listening…'};

// ---- wallet funding & referrals ----
$('fund').onclick=async()=>{
  const a=parseInt(prompt('Amount in naira (minimum ₦100):','1000'));
  if(!a||a<100){toast('The minimum is ₦100.');return}
  const r=await call('/api/payments/initiate',{method:'POST',json:{amount:a,redirect_url:location.href.split('?')[0]}});
  const j=await r.json().catch(()=>({}));
  if(r.ok)location.href=j.checkout_url;else toast(j.detail||'Payment could not start.');
};
async function checkPay(){
  const p=new URLSearchParams(location.search),ref=p.get('reference')||p.get('trxref');
  if(!ref)return;
  history.replaceState({},'',location.pathname);toast('Confirming your payment…');
  for(let i=0;i<15;i++){
    try{
      const d=await(await call('/api/payments/verify?transaction_ref='+encodeURIComponent(ref))).json();
      if(d.status==='success'){toast('Payment confirmed: +'+d.credits_added+' credits');updBal();return}
      if(d.status==='failed'){toast('Payment failed.');return}
    }catch(e){}
    await sleep(4000);
  }
  toast('Still confirming. Check your balance shortly.');
}
$('redeem').onclick=async()=>{
  const c=$('refIn').value.trim();if(!c)return;
  const r=await call('/api/user/redeem-referral',{method:'POST',json:{referrer_code:c}});
  const j=await r.json().catch(()=>({}));toast(j.message||j.detail||'Done');if(r.ok){$('refIn').value='';updBal()}
};

onAuthStateChanged(auth,u=>{
  if(!u){location.href='signup-login.html';return}
  user=u;loadChats();updBal();$('refCode').textContent=u.uid;setTimeout(checkPay,1200);
});
